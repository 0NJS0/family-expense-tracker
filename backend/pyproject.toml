[project]
name = "family-expense-backend"
version = "0.1.0"
description = "Backend API for the self-hosted family expense tracker"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0,<2",
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.143.1,<0.200",
    "openpyxl>=3.1.5,<4",
    "pillow>=13,<14",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "pyjwt>=2.15.1,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.40,<2.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.0,<1",
    "types-openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests run real tools (sh, tar, uv) on purpose.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
